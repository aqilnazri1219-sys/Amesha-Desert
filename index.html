<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempahan Pencuci Mulut</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

/* Background gelap */
#overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    z-index:998;
}

/* Sidebar */
#sidebar{
    width:280px;
    height:100vh;
    background:#ececec;
    position:fixed;
    top:0;
    left:-280px;
    z-index:999;
    border-right:1px solid #999;
    transition:0.3s;
}

#sidebar.active{
    left:0;
}

/* Butang buka menu */
#menuButton{
    font-size:35px;
    cursor:pointer;
    margin:10px;
    display:inline-block;
}

/* Butang tutup */
#closeButton{
    font-size:28px;
    cursor:pointer;
    text-align:left;
    padding:10px 15px;
}

#profile{
    text-align:center;
    padding:10px 20px 20px;
}

#profileIcon{
    width:120px;
    height:120px;
    border-radius:50%;
    border:2px solid #999;
    margin:10px auto 20px;
}

#buttonArea{
    display:flex;
    justify-content:center;
    gap:20px;
}

.authButton{
    padding:10px 20px;
    cursor:pointer;
}

.menuItem{
    border-top:1px solid #888;
    border-bottom:1px solid #888;
    text-align:center;
    padding:18px;
    cursor:pointer;
}

#mainContent{
    padding:10px;
}

#header{
    width:100%;
    height:100px;
    border-bottom:3px solid red;
    display:flex;
    justify-content:flex-start;
    align-items:center;
    padding:0 20px;
}

#menuButton{
    font-size:40px;
    cursor:pointer;
}

#headerButton{
    width:120px;
    height:55px;
    margin-right:90px;
    margin-top:-10px;
    cursor:pointer;
    position:absolute;
    left:1100px;
    top:30px;
}

#welcomeSection{
    margin-top:90px;
    margin-left:120px;
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
}

#welcomeText{
    width:650px;
    height:-5px;
    display:flex;
    align-items:center;
    padding-left:60px;
    font-size:20px;
}

#companyName{
    width:850px;
    height:80px;
    display:flex;
    align-items:center;
    padding-left:50px;
    margin-top:70px;
    font-size:22px;
    font-weight:bold;
}

#detailBox{
    width:880px;
    height:180px;
    padding-top:30px;
    padding-left:50px;
    margin-top:30px;
    font-size:20px;
}
</style>

</head>
<body>

<div id="overlay" onclick="closeMenu()"></div>

<div id="sidebar">

    <div id="closeButton" onclick="closeMenu()">
        ←
    </div>

    <div id="profile">

        <div id="profileIcon"></div>

        <div id="buttonArea">
            <button class="authButton">SIGN UP</button>
            <button class="authButton">LOG IN</button>
        </div>

    </div>

    <div class="menuItem">MENU</div>
    <div class="menuItem">MENU</div>
    <div class="menuItem">MENU</div>
    <div class="menuItem">MENU</div>

</div>

<div id="mainContent">

    <div id="menuButton" onclick="openMenu()">
        ☰
    </div>

<button id="headerButton">
        BUTTON
    </button>
<br>
_____________________________________________________________________________________________________________________________________________
</div>

<div id="welcomeSection">

    <div id="welcomeText">
        SELAMAT DATANG KE
    </div>

    <div id="companyName">
        AMESHA DESERT
    </div>

    <div id="detailBox">
        DETAIL
    </div>

</div>
<script>
function openMenu(){
    document.getElementById("sidebar").classList.add("active");
    document.getElementById("overlay").style.display = "block";
}

function closeMenu(){
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").style.display = "none";
}
</script>
</body>
</html>
